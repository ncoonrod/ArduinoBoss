[project]
name = "arduinoboss-client"
version = "1.0.0"
description = "Python client for ArduinoBoss — connects to an Arduino station and a lobby server."
requires-python = ">=3.10"
dependencies = [
	"pyserial>=3.5",
	"httpx>=0.27",
	"python-socketio[asyncio_client]>=5.11",
]

[project.scripts]
arduinoboss = "arduinoboss.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arduinoboss*"]
